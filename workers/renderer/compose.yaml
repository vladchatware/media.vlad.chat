name: media-renderer

services:
  renderer:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      RENDERER_SECRET: ${RENDERER_SECRET:?Set RENDERER_SECRET}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:?Set BLOB_READ_WRITE_TOKEN}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:?Set VERCEL_API_TOKEN}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID}
      VERCEL_ORG_ID: ${VERCEL_ORG_ID:-}
      VERCEL_QUEUE_REGION: ${VERCEL_QUEUE_REGION:-iad1}
      VERCEL_RENDER_QUEUE_TOPIC: ${VERCEL_RENDER_QUEUE_TOPIC:-media-render}
      VERCEL_RENDER_QUEUE_CONSUMER_GROUP: ${VERCEL_RENDER_QUEUE_CONSUMER_GROUP:-media-renderer}
      RENDER_WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY:-1}
      RENDER_MAX_DELIVERY_COUNT: ${RENDER_MAX_DELIVERY_COUNT:-5}
      ANALYSIS_SERVICE_SECRET: ${ANALYSIS_SERVICE_SECRET:-}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-}
      SOUNDCLOUD_USER_ID: ${SOUNDCLOUD_USER_ID:-}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch("http://127.0.0.1:3001/health");if(!r.ok)process.exit(1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    volumes:
      - renderer-data:/app/data
      - renderer-output:/app/out
    networks: [renderer-net]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://renderer:3001
    depends_on:
      renderer:
        condition: service_healthy
    networks: [renderer-net]

networks:
  renderer-net:
    driver: bridge

volumes:
  renderer-data:
  renderer-output:
